<div class="govuk-form-group" [class.govuk-form-group--error]="hasErrors">
  <fieldset
    class="govuk-fieldset"
    [id]="identifier"
    [attr.aria-describedby]="(hint() ? `${identifier}-hint ` : '') + (hasErrors ? `${identifier}-error` : '')">
    <legend class="govuk-fieldset__legend govuk-fieldset__legend--m" [id]="`l.${identifier}`">{{ legend() }}</legend>
    @if (hint()) {
      <div class="govuk-hint" [id]="`${identifier}-hint`">{{ hint() }}</div>
    }
    @if (hasErrors) {
      <govuk-error-message [identifier]="identifier" [errors]="errors" />
    }
    <div class="govuk-checkboxes" data-module="govuk-checkboxes">
      @for (option of options(); track option.value) {
        @if (option.heading) {
          <h3 class="govuk-heading-s govuk-!-margin-top-4 govuk-!-margin-bottom-2">{{ option.heading }}</h3>
        }
        @if (option.value === noFeedbackReviewGroup) {
          <div class="govuk-checkboxes__divider">or</div>
        }
        <div class="govuk-checkboxes__item">
          <input
            class="govuk-checkboxes__input"
            type="checkbox"
            [id]="`${identifier}-${$index}`"
            [name]="identifier"
            [value]="option.value"
            [checked]="selected().includes(option.value)"
            [disabled]="isDisabled()"
            (change)="onToggle(option.value, $event)"
            (blur)="onTouched()" />
          <label class="govuk-label govuk-checkboxes__label" [for]="`${identifier}-${$index}`">
            {{ option.label }}
          </label>
        </div>
      }
    </div>
  </fieldset>
</div>
