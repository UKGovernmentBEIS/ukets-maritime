@if (showCookiesBanner) {
  <mrtm-cookies-container />
}

<govuk-skip-link />

<header>
  <govuk-header>
    @if (isLoggedIn() && isGatewayServiceEnabled()) {
      <a govukLink class="govuk-link--inverse" [href]="serviceGatewayUrl">Change service</a>
    }
    @if (isLoggedIn()) {
      <button type="button" class="link-button govuk-link--inverse" (click)="logout($event)">Sign out</button>
    }
  </govuk-header>
  <govuk-service-navigation serviceName="Manage your UK ETS Reporting - Maritime" [navigation]="navigationItems()" />
</header>

<div class="govuk-width-container">
  <mrtm-incorporate-header />
  <netz-breadcrumbs />
  <netz-back-link />
  <main class="govuk-main-wrapper" id="main-content" role="main">
    <router-outlet mrtmSkipLinkFocus />
  </main>
  <mrtm-phase-bar />
</div>

<footer>
  <govuk-footer [meta]="footerMetaLinks" />
</footer>

<mrtm-timeout-banner />
