<h2 class="govuk-heading-m">Data suppliers</h2>
@if (isEditable()) {
  <a govukButton [routerLink]="['data-suppliers', 'add']">Add a new data supplier</a>
}

<govuk-table [columns]="columns" [data]="data()" emptyTableText="No items to display">
  <ng-template let-column="column" let-row="row">
    {{ row[column.field] }}
  </ng-template>
</govuk-table>
