<div class="moj-multi-file-upload moj-multi-file-upload--enhanced">
  <mrtm-file-upload-list
    [listTitle]="listTitle()"
    [headerSize]="headerSize()"
    (fileDelete)="onFileDeleteClick($event)"
    [files]="uploadedFiles()"
    [isDisabled]="isDisabled()" />

  <div class="moj-multi-file-upload__upload">
    <div class="govuk-form-group">
      <label [for]="id" [class]="`govuk-label govuk-label--${headerSize()}`" [id]="`l.${id}`">{{ label() }}</label>
      @if (hint()) {
        <div [id]="`${id}-hint`" class="govuk-hint" [innerHTML]="hint() | safeHtml"></div>
      }
      <div [id]="`${id}-hint-file-size`" class="govuk-hint">
        Your document must be a DOC, DOCX, XLS, XLSX, PPT, PPTX, VSD, VSDX, JPG, JPEG, PDF, PNG, TIF, TXT, DIB, BMP or
        CSV file, no more than 20MB.
      </div>
      <div
        (dragleave)="onDragLeave()"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event)"
        [class.moj-multi-file-upload--dragover]="isDraggedOver()"
        class="moj-multi-file-upload__dropzone">
        <!-- The native input stays for assistive technology and drag and drop; the button is the keyboard control. -->
        <input
          #input
          (change)="onFileChange($event)"
          [accept]="accepted()"
          [attr.aria-describedby]="describedBy"
          [disabled]="isDisabled()"
          [id]="id"
          [name]="id"
          class="govuk-file-upload moj-multi-file-upload__input"
          multiple
          tabindex="-1"
          type="file" />
        <p class="govuk-body">{{ dropzoneHintText() }}</p>

        <button
          govukSecondaryButton
          (blur)="onChooseFilesBlur()"
          (click)="onChooseFilesClick()"
          [disabled]="isDisabled()"
          class="govuk-!-margin-bottom-0"
          type="button">
          {{ dropzoneButtonText() }}
        </button>
        <div aria-live="polite" class="govuk-visually-hidden" role="status">{{ liveStatusText() }}</div>
      </div>
    </div>
  </div>
</div>
